name: AI Control Center QA
on:
  push:
    branches: [main, "acc/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: npm run check
      - name: Automated unit tests
        run: npm test
